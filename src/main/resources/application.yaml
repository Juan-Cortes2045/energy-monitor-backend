spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: energy-monitor-backend

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Email delivery. Every value comes from the environment: no credential is ever written here.
  # The username and password default to empty on purpose, so the application still starts with
  # no mail configured and a send attempt is recorded as failed in the notification log rather
  # than breaking the whole context. The host is required for Spring to build a JavaMailSender
  # at all, so it keeps a default.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # A silent SMTP server must not hold the request thread: bounded waits, then give up.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

security:
  jwt:
    # The iss claim. A URI rather than a bare name, as RFC 7519 expects, and validated on
    # every incoming token so a token minted for another service is rejected.
    issuer: https://energy-monitor-backend
    access-token-ttl: 15m
    private-key-path: ${SECURITY_JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:}

  reset:
    # Pepper for the password-recovery code, as HMAC-SHA256(code, pepper). The recovery code is
    # six digits, so a plain digest of it is reversible from a database dump in seconds: one
    # million candidates, all cheap to hash. The pepper is what stops that, because it lives in
    # the configuration rather than in the table, so a leaked dump yields nothing usable.
    #
    # The application refuses to start without it, exactly as it does for the signing key: a
    # recovery secret protected by a guessable pepper is not protected.
    #
    # Changing it invalidates every code already issued. Generate with:
    #   openssl rand -hex 32
    pepper: ${SECURITY_RESET_PEPPER:}
    # Six digits: what a person can read off a screen and type back without an error. Fewer
    # digits would be more comfortable to type and no safer, because the rate limit is what
    # bounds guessing, not the size of the space.
    code-digits: 6
    # How long a freshly issued code stays redeemable.
    code-validity: 15m
    # How many redemption attempts one caller address may make per window. This is the control
    # that makes a six-digit code defensible: a million combinations is few enough to exhaust by
    # brute force over the network, and the answer to that is to make the network slow.
    max-attempts-per-window: 10
    attempt-window: 15m
    # Queue that recovery requests are dispatched onto. The endpoint answers 202 before this work
    # runs, which is what removes the timing difference between a registered address and an
    # unregistered one, so the queue is part of the endpoint's behaviour and not of mail delivery.
    # Bounded, so pressure becomes refused work rather than memory behind an endpoint that keeps
    # answering. A refusal is still answered 202: a full queue must not tell a caller whether the
    # account exists.
    executor:
      worker-threads: 2
      queue-capacity: 100

  cors:
    # The origins allowed to call this API from a browser, comma separated. Empty by default,
    # which means no cross-origin caller is answered at all: fail closed until a deployment
    # states its own. '*' is deliberately not offered as a default and is refused together with
    # allow-credentials, because the Fetch specification rejects that combination outright.
    #
    # CORS is browser-only. The React web frontend needs this; the React Native client does not.
    # No cookie and no HTTP session is ever created, so allow-credentials stays false: the
    # Authorization header a browser client sends is a request header and does not depend on it.
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}
    # Wildcard origin patterns, kept separate from allowed-origins because Spring only tolerates a
    # wildcard in this list and echoes the concrete origin back rather than the pattern itself.
    allowed-origin-patterns: ${SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:}
    # Only what the web client sends. Every module reads the caller from the access token's
    # subject, so no header naming a user is allowed: a browser asking to send one is refused.
    allowed-headers: Authorization,Content-Type,Accept
    allow-credentials: false
    max-age: 30m

app:
  mail:
    # The address outgoing mail is sent from, which is the same account that owns the app password.
    from: ${MAIL_FROM:}
    # A record left PENDING claims a delivery that a previous run started and never finished. The
    # sweep closes those as failed once they are older than this. Generous compared with any real
    # SMTP conversation, so a slow send is not mistaken for a dead one; nothing is ever resent,
    # because only the security module holds the code and its hash.
    pending-threshold: 30m
    sweep-delay: 5m

notification:
  # Base URL of the web app, for the links in alert mail.
  web-url: ${NOTIFICATION_WEB_URL:http://localhost:5173}
  push:
    # VAPID key pair for Web Push (base64url: public = 65-byte point, private = 32-byte scalar).
    # Generate once per environment (docs: devices/README.md) and never rotate it casually:
    # browsers bind their subscription to the public key. Empty = push disabled.
    vapid-public-key: ${NOTIFICATION_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${NOTIFICATION_VAPID_PRIVATE_KEY:}
    subject: ${NOTIFICATION_VAPID_SUBJECT:mailto:support.energymonitor@gmail.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # A mail server that is down is not the application's health: it must not fail the probe.
      enabled: false

mqtt:
  # The backend subscribes over the plain listener. Locally and in a compose deployment the
  # broker runs next to the backend, so this connection never leaves the host; devices use TLS.
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  # Suffixed with -telemetry and -status. Must differ per backend instance.
  client-id: ${MQTT_CLIENT_ID:energy-monitor-backend}
  # Also the credentials the broker accepts for the backend: the broker asks
  # /internal/mqtt/auth/user, and these are compared there, so they live in one place.
  username: ${MQTT_BACKEND_USER:em-backend}
  password: ${MQTT_BACKEND_PASS:change-me}
  topics:
    telemetry: energy-monitor/devices/+/telemetry
    status: energy-monitor/devices/+/status
  qos: 0
  keep-alive-interval: 60
  clean-session: true
  connection-timeout: 30
  broker-auth:
    # Addresses allowed to call /internal/mqtt/auth/**: loopback and the private range Docker
    # uses, where the broker container lives. Narrow it in production if the network allows it.
    allowed-networks: ${MQTT_AUTH_ALLOWED_NETWORKS:127.0.0.1/32,::1/128,172.16.0.0/12}

device:
  connectivity:
    # A device not heard from for this long is marked OFFLINE. Telemetry comes every 60 s at
    # QoS 0, so one lost sample plus network jitter is tolerated before declaring it gone.
    offline-after: ${DEVICE_OFFLINE_AFTER:PT150S}
    check-interval: PT30S
  provisioning:
    # Broker address the web app writes to a module over Bluetooth when linking it. It must be
    # reachable from the home network: the LAN IP of this PC in development, the public domain
    # of the broker in production. Never localhost.
    mqtt-host: ${DEVICE_MQTT_PUBLIC_HOST:}
    mqtt-port: ${DEVICE_MQTT_PUBLIC_PORT:8883}

alert:
  limit:
    # Zone in which the day and the month of the consumption limit start.
    zone: ${ALERT_LIMIT_ZONE:America/Bogota}

recommendation:
  # The rules run over the hourly energy of every home with readings in the last week.
  evaluate-interval: ${RECOMMENDATION_EVALUATE_INTERVAL:PT1H}
  initial-delay: PT2M
  # Zone of the day-part rules: evening peak (18-22 h), night standby (1-5 h), calendar month.
  zone: ${RECOMMENDATION_ZONE:America/Bogota}
  # The same advice is not repeated for the same home and device within this period.
  cool-down: P7D
