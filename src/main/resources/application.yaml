spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: energy-monitor-backend

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Message broker (RabbitMQ, from infra): the device links this backend consumes, and the
  # recommendation events it publishes. Each consumer declares and binds its own queue.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:energy-monitor}
    password: ${RABBITMQ_PASSWORD:}
    # An outbox message is marked as published only after the broker confirms it and a queue took it
    # (correlated: the return of an unrouted message is known before the confirmation completes).
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # A message that keeps failing is retried three times, one, two and four seconds apart,
        # and then moved to the dead-letter queue of its queue instead of blocking the ones behind.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

server:
  # The clients reach this backend through the API gateway on 8080; the security service is on
  # 8082 on the same machine.
  port: ${SERVER_PORT:8083}

security:
  jwt:
    # The access tokens are issued by the security service; this backend only validates them,
    # with the service's public key and its iss claim. The issuer keeps the value it had before
    # the split, so the service issues it unchanged.
    issuer: https://energy-monitor-backend
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:}

  cors:
    # The origins allowed to call this API from a browser, comma separated. Empty by default,
    # which means no cross-origin caller is answered at all: fail closed until a deployment
    # states its own. '*' is deliberately not offered as a default and is refused together with
    # allow-credentials, because the Fetch specification rejects that combination outright.
    #
    # CORS is browser-only. The React web frontend needs this; the React Native client does not.
    # No cookie and no HTTP session is ever created, so allow-credentials stays false: the
    # Authorization header a browser client sends is a request header and does not depend on it.
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}
    # Wildcard origin patterns, kept separate from allowed-origins because Spring only tolerates a
    # wildcard in this list and echoes the concrete origin back rather than the pattern itself.
    allowed-origin-patterns: ${SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:}
    # Only what the web client sends. Every module reads the caller from the access token's
    # subject, so no header naming a user is allowed: a browser asking to send one is refused.
    allowed-headers: Authorization,Content-Type,Accept
    allow-credentials: false
    max-age: 30m

messaging:
  # Dead-letter exchange of the queues this application consumes.
  dead-letter-exchange: energy-monitor-backend.dlx
  # Topic exchange the device service publishes to; this backend hears device.linked and
  # device.unlinked. The connectivity events and the readings go to the alert service.
  device-exchange: energy-monitor.device
  # Topic exchange this backend announces its recommendations (recommendation.created) to,
  # through the outbox; the notification service delivers them.
  recommendation-exchange: energy-monitor.recommendation
  outbox:
    # The notification service is the only one that delivers the recommendations. Off only to go
    # back to a notification service whose consumers are off: the events are kept in
    # backend_outbox meanwhile. The variable keeps its name from when it also carried the alerts.
    relay-enabled: ${ALERT_OUTBOX_RELAY_ENABLED:true}
    poll-interval: PT1S
    batch-size: 50
    confirm-timeout: PT5S

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Calls from this backend to the other services: the device service (devices), the measurement
# service (levels and energy) and the home service (homes, members, limits). This backend serves no /internal/** of its own. The other services
# check its network and the shared token; the reverse proxy never forwards /internal/**.
internal-api:
  # Same value in every service. Empty makes the other services refuse every call of this backend.
  # Generate with: openssl rand -hex 32
  token: ${INTERNAL_API_TOKEN:}

device:
  # The device service owns the devices: its internal API answers the devices of a home and their
  # names, for the recommendations. Answers are reused for a while, and the last one is served
  # while the service does not answer.
  service:
    url: ${DEVICE_SERVICE_URL:http://localhost:8084}
    connect-timeout: 1s
    read-timeout: 2s
    ttl: 30s
    stale-ttl: 1h

home:
  # The home service owns the homes: its internal API answers a home and its members, what a user
  # is in it and its consumption limits. Answers
  # are reused for a while; the last home and limits are served while the service does not
  # answer (what a user may do in a home never is).
  service:
    url: ${HOME_SERVICE_URL:http://localhost:8086}
    connect-timeout: 1s
    read-timeout: 2s
    ttl: 30s
    stale-ttl: 1h

measurement:
  # The measurement service owns the readings: its internal API answers the consumption levels,
  # the energy of devices hour by hour and the devices that report. The levels are reused for a
  # while, and the last ones are served while the service does not answer.
  service:
    url: ${MEASUREMENT_SERVICE_URL:http://localhost:8085}
    connect-timeout: 1s
    read-timeout: 5s
    levels-ttl: 10m
    levels-stale-ttl: 24h

recommendation:
  # The rules run over the hourly energy of every home with readings in the last week.
  evaluate-interval: ${RECOMMENDATION_EVALUATE_INTERVAL:PT1H}
  initial-delay: PT2M
  # Zone of the day-part rules: evening peak (18-22 h), night standby (1-5 h), calendar month.
  zone: ${RECOMMENDATION_ZONE:America/Bogota}
  # The same advice is not repeated for the same home and device within this period.
  cool-down: P7D
