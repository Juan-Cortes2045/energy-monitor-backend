spring:
  application:
    name: energy-monitor-backend

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

security:
  jwt:
    # The iss claim. A URI rather than a bare name, as RFC 7519 expects, and validated on
    # every incoming token so a token minted for another service is rejected.
    issuer: https://energy-monitor-backend
    access-token-ttl: 15m
    private-key-path: ${SECURITY_JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info