# Each cached test context keeps its own MySQL connection pool (10 connections). With the default
# cache of 32 contexts the suite outgrows MySQL's max_connections (151) and later contexts fail
# with "Too many connections". Keeping fewer alive closes the least recently used ones instead.
spring.test.context.cache.maxSize=8

# Spring 7 pauses a cached context while another one runs and calls start() on it when it is
# reused. That start() reaches every Lifecycle bean, including the RabbitMQ listener containers
# the test profile keeps stopped (auto-startup: false), so a reused context would start consuming
# the queues a running backend uses, or fail on a broker it cannot log in to. Contexts are
# therefore never paused.
spring.test.context.cache.pause=never
