spring:
  datasource:
    url: jdbc:mysql://localhost:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    # No credential is written here. A password committed to this file belongs to whichever
    # machine created it and breaks every other one with "Access denied", so the tests read it
    # from the environment instead:
    #   SPRING_DATASOURCE_USERNAME=energy_app SPRING_DATASOURCE_PASSWORD=... ./mvnw test
    # The username keeps a default because it is not a secret; the password deliberately has
    # none, so a missing variable fails loudly instead of connecting as nobody expects.
    username: ${SPRING_DATASOURCE_USERNAME:energy_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}

security:
  jwt:
    # This profile is not active by default, so application-local.yaml is not loaded and the path
    # would otherwise resolve to empty and the context would refuse to start. A test extending
    # JwtKeyedTest replaces it with a key pair of its own; any other one falls back to the
    # per-machine public key (see application-local.yaml.example).
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:${user.home}/.energy-monitor/keys/public.pem}
  service:
    # Nothing listens here, so the suite never reaches a security service running on this machine:
    # a test that needs its answers mocks them, and every other one sees it unavailable.
    url: http://127.0.0.1:9

internal-api:
  # Test-only token: committed on purpose, because it protects nothing outside the test profile
  # and has to be the same value on every machine. Local and production use INTERNAL_API_TOKEN.
  token: test-only-internal-token

device.service:
  # Nothing listens here, so the suite never reaches a device service running on this machine.
  url: http://127.0.0.1:9

measurement.service:
  # Nothing listens here, so the suite never reaches a measurement service running on this machine.
  url: http://127.0.0.1:9

recommendation:
  # The hourly evaluation is exercised by unit tests; it must not run against the shared database.
  enabled: false

spring.rabbitmq.listener.simple:
  # No broker is needed to run the suite, and a test context must not take messages from a queue
  # a running backend consumes. The consumers are exercised by calling them directly.
  auto-startup: false

messaging.home:
  # The suite deletes homes in the shared database, and their home.deleted rows must not reach a
  # broker that a running device service consumes. Stored already discarded, a backend started
  # later on the same database never publishes them either. The relay is covered by
  # HomeOutboxRelayTest.
  relay-enabled: false
  discard-written: true

management.health.rabbit:
  enabled: false
