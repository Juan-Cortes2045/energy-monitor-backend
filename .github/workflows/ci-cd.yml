# CI: the full test suite against a real MySQL on every pull request and push to dev and main.
# No deployment: the backend is retired. Every module moved to its own service, and the infra
# repository no longer runs it.
name: Backend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: energy_monitor
          MYSQL_USER: energy_app
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_DATASOURCE_PASSWORD: ci-password
      # Throwaway values for this runner only: no real secret is used by the tests.
      SECURITY_RESET_PEPPER: ci-only-pepper-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare the local profile and a throwaway RSA pair
        run: |
          # application-local.yaml is gitignored: build it from the example with the CI password.
          sed 's/password: "CHANGE_ME"/password: "ci-password"/' \
            src/main/resources/application-local.yaml.example > src/main/resources/application-local.yaml
          keys="$HOME/.energy-monitor/keys"
          mkdir -p "$keys"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$keys/private.pem"
          openssl rsa -in "$keys/private.pem" -pubout -out "$keys/public.pem"
          echo "SECURITY_JWT_PRIVATE_KEY_PATH=$keys/private.pem" >> "$GITHUB_ENV"
          echo "SECURITY_JWT_PUBLIC_KEY_PATH=$keys/public.pem" >> "$GITHUB_ENV"

      - name: Test
        run: ./mvnw -B -ntp test

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
